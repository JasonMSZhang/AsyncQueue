<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AB-Test 分桶任务</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --card: #ffffff;
            --text: #1f2329;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #059669;
            --danger: #dc2626;
            --warn: #d97706;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 32px 16px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }
        .wrap { max-width: 760px; margin: 0 auto; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h2 { font-size: 15px; margin: 0 0 16px; }
        .field { margin-bottom: 14px; }
        .field > label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus, input[type="number"]:focus { border-color: var(--primary); }
        .row { display: flex; gap: 12px; }
        .row .field { flex: 1; }
        .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
        .checks label {
            display: flex; align-items: center; gap: 6px;
            border: 1px solid var(--border); border-radius: 6px;
            padding: 6px 8px; cursor: pointer; font-size: 13px;
        }
        .checks label:hover { border-color: var(--primary); }
        button {
            background: var(--primary); color: #fff; border: 0; border-radius: 6px;
            padding: 9px 18px; font-size: 14px; cursor: pointer;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { opacity: .6; cursor: not-allowed; }
        .msg { margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 13px; display: none; }
        .msg.ok { display: block; background: #ecfdf5; color: var(--success); border: 1px solid #a7f3d0; }
        .msg.err { display: block; background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
        .task-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
        .meta { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin-top: 4px; }
        .meta .k { color: var(--muted); }
        .badge {
            display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
        }
        .badge.SUCCESS { background: #ecfdf5; color: var(--success); }
        .badge.FAILED, .badge.DEAD_LETTER { background: #fef2f2; color: var(--danger); }
        .badge.PENDING { background: #eff6ff; color: var(--primary); }
        .badge.PROCESSING { background: #fffbeb; color: var(--warn); }
        table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; background: #fafafa; }
        .tag-treatment { color: var(--success); font-weight: 600; }
        .tag-control { color: var(--muted); font-weight: 600; }
        .empty { color: var(--muted); font-size: 13px; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>AB-Test 分桶任务</h1>
    <p class="subtitle">提交任务后可在下方按 taskId 查询执行状态与分桶结果</p>

    <section class="card">
        <h2>① 提交分桶任务</h2>
        <form id="submitForm" autocomplete="off">
            <div class="field">
                <label for="uid">用户 ID (uid)</label>
                <input type="text" id="uid" name="uid" placeholder="例如 u10086" required>
            </div>

            <div class="field">
                <label>实验 ID（可多选）</label>
                <div class="checks" id="expChecks">
                    <label><input type="checkbox" name="expIdList" value="test1"> test1</label>
                    <label><input type="checkbox" name="expIdList" value="test2"> test2</label>
                    <label><input type="checkbox" name="expIdList" value="test3"> test3</label>
                    <label><input type="checkbox" name="expIdList" value="test4"> test4</label>
                    <label><input type="checkbox" name="expIdList" value="test5"> test5</label>
                    <label><input type="checkbox" name="expIdList" value="test6"> test6</label>
                    <label><input type="checkbox" name="expIdList" value="test7"> test7</label>
                    <label><input type="checkbox" name="expIdList" value="test8"> test8</label>
                    <label><input type="checkbox" name="expIdList" value="test9"> test9</label>
                    <label><input type="checkbox" name="expIdList" value="test10"> test10</label>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label for="priority">优先级 (0~9)</label>
                    <input type="number" id="priority" name="priority" value="5" min="0" max="9" required>
                </div>
                <div class="field">
                    <label for="maxRetry">最大重试次数</label>
                    <input type="number" id="maxRetry" name="maxRetry" value="3" min="0" required>
                </div>
            </div>

            <button type="submit" id="submitBtn">提交任务</button>
            <div class="msg" id="submitMsg"></div>
        </form>
    </section>

    <section class="card">
        <h2>② 查询任务</h2>
        <form id="queryForm" autocomplete="off">
            <div class="field">
                <label for="queryTaskId">taskId</label>
                <input type="text" id="queryTaskId" name="taskId" placeholder="提交后返回的 taskId" required>
            </div>
            <button type="submit" id="queryBtn">查询</button>
        </form>
        <div id="detail"></div>
    </section>
</div>

<script>
    const $ = (id) => document.getElementById(id);

    const STATUS_TEXT = {
        PENDING: '排队中',
        PROCESSING: '处理中',
        SUCCESS: '成功',
        FAILED: '失败',
        DEAD_LETTER: '死信'
    };

    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function setMsg(el, text, isError) {
        el.textContent = text;
        el.className = 'msg ' + (isError ? 'err' : 'ok');
    }

    $('submitForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);
        const expIds = formData.getAll('expIdList');
        const msg = $('submitMsg');

        if (expIds.length === 0) {
            setMsg(msg, '请至少选择一个实验', true);
            return;
        }

        const body = new URLSearchParams();
        body.set('uid', formData.get('uid'));
        expIds.forEach((id) => body.append('expIdList', id));
        body.set('priority', formData.get('priority'));
        body.set('maxRetry', formData.get('maxRetry'));

        const btn = $('submitBtn');
        btn.disabled = true;
        try {
            const res = await fetch('/task/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: body.toString()
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setMsg(msg, data.message || ('提交失败，HTTP ' + res.status), true);
                return;
            }
            setMsg(msg, '提交成功，taskId：' + data.taskId, false);
            $('queryTaskId').value = data.taskId;
        } catch (err) {
            setMsg(msg, '网络错误：' + err.message, true);
        } finally {
            btn.disabled = false;
        }
    });

    $('queryForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const taskId = $('queryTaskId').value.trim();
        if (!taskId) {
            return;
        }
        const detail = $('detail');
        const btn = $('queryBtn');
        btn.disabled = true;
        try {
            const res = await fetch('/task/' + encodeURIComponent(taskId));
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                detail.innerHTML = '<p class="msg err" style="display:block">'
                    + escapeHtml(data.message || ('查询失败，HTTP ' + res.status)) + '</p>';
                return;
            }
            detail.innerHTML = renderDetail(data);
        } catch (err) {
            detail.innerHTML = '<p class="msg err" style="display:block">网络错误：'
                + escapeHtml(err.message) + '</p>';
        } finally {
            btn.disabled = false;
        }
    });

    function renderDetail(task) {
        const status = task.status || 'UNKNOWN';
        let html = '<div class="meta">'
            + '<div class="k">taskId</div><div class="task-id">' + escapeHtml(task.taskId) + '</div>'
            + '<div class="k">状态</div><div><span class="badge ' + escapeHtml(status) + '">'
            + escapeHtml(STATUS_TEXT[status] || status) + ' (' + escapeHtml(status) + ')</span></div>'
            + '<div class="k">已重试次数</div><div>' + escapeHtml(task.retryCount) + ' / '
            + escapeHtml(task.maxRetry) + '</div>';

        if (task.failReason) {
            html += '<div class="k">失败原因</div><div>' + escapeHtml(task.failReason) + '</div>';
        }
        html += '</div>';

        const results = task.result;
        if (Array.isArray(results) && results.length > 0) {
            html += '<table><thead><tr><th>实验</th><th>桶号</th><th>分组</th></tr></thead><tbody>';
            results.forEach((item) => {
                const treatment = item.treatment === true;
                html += '<tr><td>' + escapeHtml(item.expId) + '</td>'
                    + '<td>' + escapeHtml(item.bucket) + '</td>'
                    + '<td class="' + (treatment ? 'tag-treatment' : 'tag-control') + '">'
                    + (treatment ? '实验组 treatment' : '对照组 control') + '</td></tr>';
            });
            html += '</tbody></table>';
        } else if (status === 'SUCCESS') {
            html += '<p class="empty">任务已完成，但结果为空</p>';
        } else if (status === 'PENDING' || status === 'PROCESSING') {
            html += '<p class="empty">任务尚未执行完成，请稍后重新查询</p>';
        }
        return html;
    }
</script>
</body>
</html>
