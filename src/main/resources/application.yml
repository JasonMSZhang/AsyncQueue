server:
  port: 8080
  # 优雅停机：先停止接收新请求，再走 Spring 生命周期关闭流程
  shutdown: graceful

spring:
  application:
    name: async-queue

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    # H2 文件模式；如需“事务提交即落盘”（返回即不丢），在末尾追加 ;WRITE_DELAY=0（会降低写入吞吐）
    url: jdbc:h2:file:./data/abtask;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: AsyncQueueHikari
      maximum-pool-size: 16
      minimum-idle: 4
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    # 建表交由 schema-h2.sql 负责，避免 Hibernate 自动生成与手写 DDL 冲突
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      encoding: UTF-8
      continue-on-error: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

async-queue:
  queue:
    # 有界优先级队列容量；满时任务提交侧触发背压（任务已在库，不会丢失）
    capacity: 4096

  executor:
    # 任务为 CPU + IO(sleep) 混合，按 N = CPU 核数 × (1 + W/C) 估算；8 核机器取 16
    worker-count: 16
    # 模拟业务 IO 耗时（毫秒），0 表示不模拟
    simulate-io-millis: 50
    # 停机时等待消费线程退出的时间
    shutdown-timeout-seconds: 20

  retry:
    # 指数退避：第 n 次重试等待 base × 2^(n-1) 秒，最大不超过 max-delay
    base-delay-seconds: 1
    max-delay-seconds: 60

  cache:
    # AB 分桶本地缓存 TTL，需求固定 180 秒
    ttl-seconds: 180
    max-size: 200000

management:
  endpoints:
    web:
      exposure:
        # 对外暴露 Prometheus 抓取端点 /actuator/prometheus
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: async-queue

logging:
  level:
    root: INFO
    com.example.asyncqueue: DEBUG
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
